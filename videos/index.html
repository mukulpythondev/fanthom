<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fathom Build - Intro Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0c0c0f;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 640px;
      padding: 2rem;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; color: #2d8cf0; }
    p { color: #9090a0; margin-bottom: 2rem; line-height: 1.6; }
    .placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: #141418;
      border: 2px dashed #2a2a34;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }
    .placeholder span {
      color: #606070;
      font-size: 1.1rem;
    }
    .info {
      background: #141418;
      border: 1px solid #1f1f28;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: left;
    }
    .info h2 { font-size: 1rem; color: #f0f0f5; margin-bottom: 0.5rem; }
    .info p { font-size: 0.875rem; color: #9090a0; margin-bottom: 0.5rem; }
    .info code {
      background: #1c1c22;
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #2d8cf0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fathom Build</h1>
    <p>Meeting intelligence powered by AI. This 1-minute intro video explains the product.</p>
    <div class="placeholder">
      <span>intro-video.mp4</span>
    </div>
    <div class="info">
      <h2>To add your intro video:</h2>
      <p>1. Record a 1-minute screen recording explaining the product</p>
      <p>2. Save it as <code>videos/intro-video.mp4</code></p>
      <p>3. Replace the placeholder above with a <code>&lt;video&gt;</code> element</p>
    </div>
  </div>
</body>
</html>
